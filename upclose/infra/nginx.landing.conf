events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    sendfile on;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-cache always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        location = /health { default_type text/plain; return 200 "ok\n"; }
        # This container serves marketing only. Product/auth/report requests belong to the app host.
        location /api/ { return 404; }
        location /r/ { return 404; }
        location / { try_files $uri $uri/ =404; }
    }
}
