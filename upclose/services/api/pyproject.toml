[project]
name = "upclose-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "stripe>=16,<17",
  "uvicorn>=0.34,<1",
  "meta-sam-parser==0.1.0",
  "pillow>=11,<13",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
