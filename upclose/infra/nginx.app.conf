events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Owner/report paths, bearer headers and signed queries must never enter request logs.
    access_log off;
    error_log /dev/null;
    server_tokens off;
    sendfile on;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' https: http://localhost:4566 http://127.0.0.1:4566; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        location = /health { default_type text/plain; return 200 "ok\n"; }
        location /api/v1 {
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For "";
            proxy_cache off;
            proxy_buffering off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Content-Type-Options nosniff always;
        }
        location /r {
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For "";
            proxy_cache off;
            proxy_buffering off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Content-Type-Options nosniff always;
        }
        # Provider return navigation loads the application and grants no payment authority.
        location = /checkout/return { try_files /index.html =404; }
        location = /checkout/return/ { try_files /index.html =404; }
        location /assets/ { try_files $uri =404; }
        location ~ /\. { return 404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
