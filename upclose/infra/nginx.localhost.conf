events {}
http {
    # Neither owner/report paths nor request query strings belong in edge logs.
    access_log off;
    error_log /dev/null;
    server_tokens off;
    # Resolve service addresses through Docker after backend containers restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080 default_server;
        server_name _;
        return 404;
    }
    server {
        listen 8080;
        server_name localhost;
        location / {
            set $landing_upstream http://landing:8080;
            proxy_pass $landing_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For "";
        }
    }
    server {
        listen 8080;
        server_name app.localhost;
        location / {
            set $app_upstream http://app:8080;
            proxy_pass $app_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For "";
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
