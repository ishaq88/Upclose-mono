# Opt-in overlay. Use scripts/phone-dev.ps1; default Compose stack is unchanged.
services:
  postgres:
    ports: !reset []
  floci:
    ports: !reset []
  storage-init:
    environment:
      S3_BUCKET: upclose-phone
      WEB_ORIGIN: https://${PHONE_BIND_IP:?Run phone-dev.ps1}:8443
  api:
    ports: !reset []
    environment: &phone-environment
      APP_BASE_URL: https://${PHONE_BIND_IP}:8443
      WEB_ORIGIN: https://${PHONE_BIND_IP}:8443
      S3_BUCKET: upclose-phone
      S3_PUBLIC_ENDPOINT: https://${PHONE_BIND_IP}:9443
      MODEL_MODE: fixture
      PAYMENTS_MODE: fixture
      PUBLIC_SHARING_ENABLED: "false"
      DEMO_SESSION_ID: ""
      CONSENT_VERSION: upclose-prototype-v1
      OPERATOR_TOKEN: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_REPORT_PRICE_ID: ""
      TRUSTED_PROXY_HOSTS: "[]"
      SESSION_CREATION_LIMIT_PER_DAY: "20"
  worker:
    environment: *phone-environment
  web:
    ports: !reset []
  phone-gateway:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    ports:
      - "${PHONE_LISTEN_IP:-${PHONE_BIND_IP}}:8443:8443"
      - "${PHONE_LISTEN_IP:-${PHONE_BIND_IP}}:9443:9443"
    volumes:
      - "${PHONE_TLS_DIR:?Run phone-dev.ps1}/server.crt:/etc/nginx/tls/server.crt:ro"
      - "${PHONE_TLS_DIR}/server.key:/etc/nginx/tls/server.key:ro"
      - "${PHONE_TLS_DIR}/ca.crt:/etc/nginx/tls/ca.crt:ro"
    configs:
      - source: phone-nginx
        target: /etc/nginx/nginx.conf
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
    # Compose materializes inline config content into the container before startup.
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
configs:
  phone-nginx:
    content: |
      events {}
      http {
        access_log off;
        # Do not log bearer requests or signed query strings, including on proxy errors.
        error_log /dev/null;
        server_tokens off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        client_max_body_size 9m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
        server {
          listen 8443 ssl;
          server_name _;
          add_header Referrer-Policy no-referrer always;
          add_header Cache-Control "private, no-store" always;
          location = /phone-ca.crt {
            alias /etc/nginx/tls/ca.crt;
            default_type application/x-x509-ca-cert;
          }
          location /api/v1/operator { return 404; }
          location /api/v1/webhooks { return 404; }
          location = /health { proxy_pass http://api:8000; }
          location = /ready { proxy_pass http://api:8000; }
          location /api/v1/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Forwarded-For "";
          }
          location /r/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $$http_host;
          }
          location / {
            proxy_pass http://web:5173;
            proxy_set_header Host $$http_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection "upgrade";
          }
        }
        server {
          listen 9443 ssl;
          server_name _;
          # Viewer withholds images. Never expose emulator GET/list/admin APIs.
          location /upclose-phone/ {
            limit_except PUT OPTIONS { deny all; }
            # Preserve signed host, port, URI and query exactly.
            proxy_pass http://floci:4566;
            proxy_set_header Host $$http_host;
          }
          location / { return 404; }
        }
      }
