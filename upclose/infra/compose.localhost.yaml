# Local hostname routing; layer after compose.yaml and compose.hosts.yaml.
# Shares existing development data. Never use this HTTP recipe for public hosting.
services:
  api:
    environment:
      WEB_ORIGIN: http://app.localhost
      APP_BASE_URL: http://app.localhost
  worker:
    environment:
      WEB_ORIGIN: http://app.localhost
      APP_BASE_URL: http://app.localhost
  storage-init:
    environment:
      WEB_ORIGIN: http://app.localhost
  landing:
    build:
      args:
        VITE_APP_ORIGIN: http://app.localhost
        LANDING_ALLOW_LOCAL_APP: "true"
  local-edge:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    ports: ["127.0.0.1:80:8080"]
    volumes: ["./nginx.localhost.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      app: {condition: service_healthy}
      landing: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
